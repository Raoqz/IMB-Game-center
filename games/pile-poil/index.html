<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>IMB Game Center - Pile Poil</title>

  <!-- Polices, Tailwind & Styles globaux pour le GameShell -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">

  <!-- Firebase SDK Compat & Confetti & GameShell -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="/shared/game-shell.js"></script>

  <style>
    :root{--ink:#12102b;--sun:#ffd426;--blue:#2433f2;--pink:#ff4f6d;--mint:#2ee6a6;--sky:#5cc8ff;--paper:#fffdf5}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:linear-gradient(170deg,#3a49ff,#2433f2 55%,#1b1f6b);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
    #stage{position:fixed;inset:0;display:grid;place-items:center}
    canvas{display:block;touch-action:none}
    .ui{position:absolute;inset:0;pointer-events:none;z-index:10}
    .ui>*{pointer-events:auto}
    #score{position:absolute;left:0;right:0;top:max(68px,env(safe-area-inset-top));text-align:center;font-size:clamp(40px,8vh,74px);font-weight:900;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);pointer-events:none;transition:transform .12s}
    #score.pop{transform:scale(1.22)}
    #target{position:absolute;left:0;right:0;top:calc(max(68px,env(safe-area-inset-top)) + clamp(48px,9vh,86px));text-align:center;font-weight:900;font-size:13px;pointer-events:none}
    #target span{background:#12102bcc;border-radius:99px;padding:3px 12px}
    #top{position:absolute;right:14px;top:68px;display:flex;gap:8px;z-index:20}
    .btn{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
    .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
    .btn.primary{background:var(--sun);font-size:20px;padding:12px 26px}
    .panel{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 28px));max-height:calc(100dvh - 90px);overflow:auto;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:20px;text-align:center;z-index:15}
    .hide{display:none!important}
    .title{font-size:clamp(36px,9vw,54px);font-weight:900;font-style:italic;line-height:.95;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);margin:4px 0 8px}
    .muted{color:#5d5b80;font-weight:700;font-size:14px}
    .row{display:flex;gap:10px;justify-content:center;align-items:stretch;margin:12px 0}
    .stat{flex:1;background:#f1efff;border:3px solid var(--ink);border-radius:16px;padding:8px}
    .stat b{display:block;font-size:28px}
    .stat small{font-weight:800;color:#5d5b80;font-size:12px}
    .medal{font-size:56px;line-height:1;margin:2px 0;filter:drop-shadow(0 4px 0 #12102b55)}
    .lb{text-align:left;margin:10px 0 4px;display:grid;gap:4px}
    .lb div{display:flex;gap:8px;align-items:center;padding:5px 10px;border-radius:12px;background:#f1efff;font-weight:800;font-size:14px}
    .lb div.you{background:#fff1b8;border:2px solid var(--ink)}
    .lb div span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lb h4{font-size:13px;color:#5d5b80;margin-bottom:2px}
    .rec{display:inline-block;background:var(--pink);color:#fff;font-weight:900;border:3px solid var(--ink);border-radius:99px;padding:4px 14px;margin:6px 0;animation:wig .5s ease-in-out infinite alternate}
    @keyframes wig{from{transform:rotate(-3deg)}to{transform:rotate(3deg) scale(1.08)}}
    .hint{position:absolute;left:0;right:0;bottom:14%;text-align:center;font-weight:900;font-size:18px;pointer-events:none;animation:blink 1s ease-in-out infinite alternate;padding:0 12px}
    .hint span{background:#12102bcc;border-radius:99px;padding:6px 16px;display:inline-block}
    @keyframes blink{to{opacity:.45}}
    #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
    #flash.on{animation:fl .35s ease-out}
    @keyframes fl{from{opacity:.85}to{opacity:0}}
    .popup{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:clamp(26px,5vw,40px);font-weight:900;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;animation:popup 1.3s ease-out forwards}
    @keyframes popup{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
    #confetti{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
  </style>
</head>
<body>

<div id="stage"><canvas id="cv"></canvas></div>
<div class="ui">
  <canvas id="confetti"></canvas>
  <div id="score" class="hide">0</div>
  <div id="target" class="hide"><span></span></div>
  <div id="top">
    <button class="btn" onclick="GameShell.openRules()" title="Règles">📖</button>
    <button class="btn" id="mute" title="Son">🔊</button>
  </div>
  <div id="flash"></div>
  <div class="hint hide" id="hint"><span>Touche au bon moment pour poser</span></div>
  <div class="panel" id="menu">
    <div class="title">PILE<br>POIL</div>
    <p class="muted">Empile les disques le plus haut possible. Ce qui dépasse tombe… vise pile poil pour garder ta largeur !</p>
    <div class="row">
      <div class="stat"><b id="mBest">0</b><small>ton record</small></div>
      <div class="stat"><b id="mHub">–</b><small id="mHubWho">record promo</small></div>
    </div>
    <button class="btn primary" id="play">▶ Jouer</button>
    <p class="muted" style="margin-top:8px;font-size:12px">Clic, touche ou Espace pour poser le disque</p>
    <div class="lb" id="mLb"></div>
  </div>
  <div class="panel hide" id="over">
    <div class="medal" id="medal">🥉</div>
    <div class="muted" id="medalTxt"></div>
    <div id="recBox"></div>
    <div class="row">
      <div class="stat"><b id="oScore">0</b><small id="oLabel">étages</small></div>
      <div class="stat"><b id="oBest">0</b><small>ton record</small></div>
    </div>
    <button class="btn primary" id="again">↻ Rejouer</button>
    <p class="muted" style="margin-top:8px;font-size:12px">Espace ou Entrée pour rejouer</p>
    <div class="lb" id="oLb"></div>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   PONT FIREBASE <-> PILE POIL (Remplace _sdk.js)
   Relie le jeu au GameShell et à db.ref('scores/pile-poil')
   ========================================================= */
function waitForShellUser() {
  return new Promise((resolve) => {
    if (window.GameShell && GameShell.currentUser) {
      return resolve(GameShell.currentUser);
    }
    const iv = setInterval(() => {
      if (window.GameShell && GameShell.currentUser) {
        clearInterval(iv);
        resolve(GameShell.currentUser);
      }
    }, 80);
  });
}

window.ChadGang = {
  debutPartie: function () {
    return Promise.resolve({
      run: 'imb-' + Date.now(),
      seed: 1 + Math.floor(Math.random() * 2147483646)
    });
  },

  classement: async function () {
    const user = await waitForShellUser();
    const snap = await db.ref('scores/pile-poil').once('value');
    const data = snap.val() || {};
    const sorted = Object.values(data).sort((a, b) => (b.wins || 0) - (a.wins || 0));

    const rows = sorted.map((p, idx) => ({
      id: p.tag,
      name: `${p.avatarEmoji || '🍺'} ${p.nickname}`,
      best: p.wins || 0,
      rank: idx + 1,
      you: Boolean(user && p.tag === user.tag)
    }));

    const me = rows.find(r => r.you) || null;
    return {
      mode: 'score',
      unit: 'étages',
      rows: rows,
      me: me
    };
  },

  finPartie: async function (o) {
    const score = typeof o.score === 'number' ? Math.floor(o.score) : 0;
    if (score <= 0) return { counted: false, record: false };

    const user = await waitForShellUser();
    if (!user || !user.tag) return { counted: false, record: false };

    // Vérifier le record global de la promo avant d'enregistrer
    const allSnap = await db.ref('scores/pile-poil').once('value');
    const allData = allSnap.val() || {};
    let currentPromoBest = 0;
    Object.values(allData).forEach(p => {
      if ((p.wins || 0) > currentPromoBest) currentPromoBest = p.wins || 0;
    });

    const myRef = db.ref(`scores/pile-poil/${user.tag}`);
    const mySnap = await myRef.once('value');
    const existing = mySnap.val();
    const previousBest = existing ? (existing.wins || 0) : 0;

    if (score > previousBest) {
      await myRef.set({
        tag: user.tag,
        nickname: user.nickname,
        avatarEmoji: user.avatarEmoji || '🍺',
        wins: score, // Stocké dans "wins" pour être compatible avec GameShell & Lobby
        best: score,
        plays: (existing && existing.plays ? existing.plays : 0) + 1,
        updatedAt: Date.now()
      });
    } else if (existing) {
      await myRef.update({
        nickname: user.nickname,
        avatarEmoji: user.avatarEmoji || '🍺',
        plays: (existing.plays || 0) + 1
      });
    }

    return {
      counted: true,
      record: score > currentPromoBest,
      previous: previousBest
    };
  }
};

/* Initialisation du Shell IMB Game Center */
GameShell.init({
  gameId: 'pile-poil',
  gameTitle: '🥞 Pile Poil',
  rulesHtml: `
    <p>• 🥞 <strong>Objectif :</strong> Empile les blocs les uns sur les autres pour construire la tour la plus haute possible !</p>
    <p>• ✂️ <strong>Découpe :</strong> Tout ce qui dépasse du bloc précédent est coupé et perdu. Ton bloc devient donc de plus en plus étroit.</p>
    <p>• 🔥 <strong>Combo Pile Poil :</strong> Si tu poses un bloc exactement aligné ("Pile Poil"), tu gardes toute ta largeur. À partir de 3 "Pile Poil" d'affilée, ton bloc s'élargit à nouveau !</p>
    <p>• ⌨️ <strong>Commandes :</strong> Clic gauche, touche tactile, Espace ou Flèche du bas.</p>
  `
});

/* ===== Kit commun (menus, sons, classement du hub, records) ===== */
const $=id=>document.getElementById(id);

// Autoriser les gestes tactiles dans les panneaux du jeu ET dans les éléments du GameShell (chat, topbar, modales)
for(const ev of ['touchmove','touchstart']){
  document.addEventListener(ev,e=>{
    if(!e.target.closest('.panel,button,input,a,#top,#shellTopBar,#shellChatBox,#shellModalRules,#shellModalLeaderboard,#shellUsersDropdown,#shellInviteStack')){
      e.preventDefault();
    }
  },{passive:false});
}
document.addEventListener('gesturestart',e=>e.preventDefault());

// Fonction utilitaire : vérifie si l'utilisateur écrit dans un champ texte (ex: Chat du Shell)
function isTypingInInput(e) {
  const el = e.target || document.activeElement;
  if (!el) return false;
  const tag = (el.tagName || '').toUpperCase();
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

const CG=(()=>{
  const cfg={key:'jeu',unit:'',medals:[[10,'🥉','Médaille de bronze'],[25,'🥈','Médaille d\'argent'],[50,'🥇','Médaille d\'or'],[100,'💎','Médaille de diamant !']],lowMsg:'Encore un effort…',onStart(){},fmt:n=>String(n)};
  const HUB=typeof ChadGang!=='undefined';
  let best=0,hubTop=null,state='menu',overAt=0,muted=false,AC=null;
  const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{return null}};
  /* sons */
  function ac(){if(muted)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch{return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
  function tone(f,t,d,o={}){const c=ac();if(!c)return;const os=c.createOscillator(),g=c.createGain(),t0=c.currentTime+t;os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime((o.v||.5)*.18,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);os.connect(g);g.connect(c.destination);os.start(t0);os.stop(t0+d+.02)}
  function noise(t,d,v,f,type){const c=ac();if(!c)return;const n=Math.max(1,Math.floor(c.sampleRate*d)),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type=type||'lowpass';fl.frequency.value=f||1200;g.gain.value=(v||.5)*.2;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(c.currentTime+t)}
  const sfx={tone,noise,
    point(){tone(988,0,.08,{type:'square',v:.22});tone(1319,.07,.14,{type:'square',v:.22})},
    big(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.06,.16,{type:'triangle',v:.4}))},
    hit(){noise(0,.25,1,700);tone(160,0,.3,{type:'sawtooth',v:.5,to:50})},
    lose(){tone(600,0,.5,{type:'triangle',v:.35,to:110})},
    record(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.25,{type:'triangle',v:.55}))},
    click(){tone(700,0,.05,{type:'square',v:.15})},
  };
  try{muted=ls(cfg.key+'_mute')==='1'}catch{}
  /* confettis (calque au-dessus du jeu) */
  const cc=$('confetti'),cx=cc.getContext('2d');let parts=[],craf=0;
  function confetti(n){const r=devicePixelRatio||1;cc.width=innerWidth*r;cc.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0);
    const cols=['#ffd426','#ff4f6d','#2ee6a6','#6c8dff','#fff','#ff9f1c'];for(let i=0;i<n;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:9+Math.random()*8,c:cols[i%6],l:240});
    if(!craf)craf=requestAnimationFrame(cloop)}
  function cloop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>--p.l>0&&p.y<innerHeight+30);for(const p of parts){p.x+=p.vx+Math.sin(p.l/9)*.6;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}craf=parts.length?requestAnimationFrame(cloop):0}
  /* classement du hub */
  function lbHtml(el,d){el.replaceChildren();if(!d||!d.rows||!d.rows.length)return;
    const h=document.createElement('h4');h.textContent='🏆 Classement de la Promo';el.append(h);
    const line=(rk,name,val,you)=>{const x=document.createElement('div');if(you)x.className='you';[rk,name,val].forEach(t=>{const s=document.createElement('span');s.textContent=t;x.append(s)});el.append(x)};
    d.rows.slice(0,5).forEach((r,i)=>line(['🥇','🥈','🥉'][i]||(i+1)+'.',r.name+(r.you?' (toi)':''),r.best==null?'–':cfg.fmt(r.best)+(cfg.unit?' '+cfg.unit:''),r.you));
    if(d.me&&d.me.rank>5)line(d.me.rank+'.','Toi',d.me.best==null?'–':cfg.fmt(d.me.best)+(cfg.unit?' '+cfg.unit:''),true)}
  function loadHub(){if(!HUB||typeof ChadGang.classement!=='function')return;
    ChadGang.classement().then(d=>{hubTop=d;const r=d.rows&&d.rows[0];
      $('mHub').textContent=r&&r.best!=null?cfg.fmt(r.best):'–';$('mHubWho').textContent=r?'record de '+r.name:'record promo';
      if(d.me&&d.me.best!=null&&better(d.me.best,best)){best=d.me.best;ls(cfg.key+'_best',best)}$('mBest').textContent=best?cfg.fmt(best):'0';
      lbHtml($('mLb'),d);if(state==='over')lbHtml($('oLb'),d)}).catch(()=>{})}
  const better=(a,b)=>cfg.lower?(b===0||a<b):a>b;
  const hubRecord=()=>{const r=hubTop&&hubTop.rows&&hubTop.rows[0];return r&&r.best!=null?r:null};
  /* affichage */
  function setScore(n,pop){const e=$('score');e.textContent=cfg.fmt(n);if(pop){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}
  let tgtNotified=false;
  function target(score){const r=hubRecord(),t=$('target');if(state!=='play'){t.classList.add('hide');return}
    let txt='';if(r&&!better(score,r.best))txt='👑 '+r.name+' : '+cfg.fmt(r.best);else if(r){txt='👑 NOUVEAU RECORD DE LA PROMO !';if(!tgtNotified){tgtNotified=true;popup('👑 RECORD PROMO !');sfx.record()}}else if(best)txt='Ton record : '+cfg.fmt(best);
    t.classList.toggle('hide',!txt);t.firstChild.textContent=txt}
  function popup(txt){const d=document.createElement('div');d.className='popup';d.textContent=txt;document.querySelector('.ui').append(d);setTimeout(()=>d.remove(),1400)}
  function flash(){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
  /* déroulé */
  let ticket=null,fetching=null,run=null,sim=null,queue=[],ev=[],endF=null;
  const canRun=()=>HUB&&typeof ChadGang.debutPartie==='function';
  function prefetch(){if(!canRun()||ticket||fetching)return fetching;fetching=ChadGang.debutPartie().then(t=>{ticket=t}).catch(()=>{}).finally(()=>{fetching=null});return fetching}
  function setSim(s){sim=s;queue=[];ev=[];endF=null}
  function input(c){if(state==='play'&&sim&&!sim.over)queue.push(c)}
  function tick(){if(!sim)return;if(!sim.over)for(const c of queue){sim.input(c);ev.push([sim.frame,c])}queue=[];sim.step();if(sim.over&&endF===null)endF=sim.frame}
  async function start(){
    if(cfg.sim&&canRun()&&!ticket){$('play').disabled=$('again').disabled=true;await Promise.race([prefetch(),new Promise(r=>setTimeout(r,2500))]);$('play').disabled=$('again').disabled=false}
    run=ticket;ticket=null;prefetch();
    const seed=run?run.seed:(Math.random()*2147483646|0)+1;
    state='play';tgtNotified=false;$('menu').classList.add('hide');$('over').classList.add('hide');$('score').classList.remove('hide');$('hint').classList.remove('hide');setTimeout(()=>$('hint').classList.add('hide'),2600);ac();cfg.onStart(seed);target(0)}
  function over(score,label){
    if(state!=='play')return;state='over';overAt=performance.now();
    const isBest=score>0&&(best===0||better(score,best));if(isBest){best=score;ls(cfg.key+'_best',best)}
    $('oScore').textContent=cfg.fmt(score);$('oBest').textContent=cfg.fmt(best);$('oLabel').textContent=label||'score';
    let m=null;for(const x of cfg.medals)if(cfg.lower?score<=x[0]:score>=x[0])m=x;
    $('medal').textContent=m?m[1]:'💤';$('medalTxt').textContent=m?m[2]:cfg.lowMsg;
    const rb=$('recBox');rb.replaceChildren();
    const tag=t=>{rb.replaceChildren();const s=document.createElement('div');s.className='rec';s.textContent=t;rb.append(s)};
    if(isBest)tag('⭐ Nouveau record perso !');
    $('score').classList.add('hide');$('target').classList.add('hide');$('hint').classList.add('hide');
    setTimeout(()=>{$('over').classList.remove('hide');lbHtml($('oLb'),hubTop)},cfg.overDelay||600);
    const payload={score};
    if(HUB&&typeof ChadGang.finPartie==='function'&&score>0){
      ChadGang.finPartie(payload).then(r=>{
        if(r&&r.record){tag('👑 RECORD DE LA PROMO BATTU !');sfx.record();confetti(160)}else if(isBest){sfx.record();confetti(60)}
        loadHub();
      }).catch(()=>{});
    }else if(isBest){sfx.record();confetti(60)}
  }
  function showMute(){$('mute').textContent=muted?'🔇':'🔊'}
  $('mute').onclick=e=>{e.stopPropagation();muted=!muted;ls(cfg.key+'_mute',muted?'1':'0');showMute()};
  $('play').onclick=e=>{e.stopPropagation();start()};
  $('again').onclick=e=>{e.stopPropagation();start()};
  addEventListener('keydown',e=>{
    if(isTypingInInput(e))return;
    if((e.code==='Space'||e.code==='Enter')&&(state==='menu'||(state==='over'&&performance.now()-overAt>700))){
      e.preventDefault();start();
    }
  });
  function init(o){
    Object.assign(cfg,o);
    prefetch();
    best=+ls(cfg.key+'_best')||0;
    try{muted=ls(cfg.key+'_mute')==='1'}catch{}
    showMute();
    $('mBest').textContent=cfg.fmt(best);
    loadHub();
    // Rafraîchir automatiquement le classement en direct quand un camarade bat un record
    db.ref('scores/pile-poil').on('value', () => loadHub());
  }
  return{init,start,over,setSim,input,tick,get sim(){return sim},setScore,target,popup,flash,confetti,sfx,get state(){return state},get best(){return best},hubRecord,ac};
})();

/* ===== Simulation de Pile Poil ===== */
var SIM=function(seed,hooks){
  hooks=hooks||{};var emit=hooks.ev||function(){};
  var st=seed>>>0;function rnd(){st=(st+0x6D2B79F5)>>>0;var t=st;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}
  var BASEW=240,REACH=150;
  var hue0=Math.floor(rnd()*360);
  var S={frame:0,over:false,dying:0,score:0,combo:0,hue0:hue0,stack:[{x:-BASEW/2,w:BASEW,y:0,h:hue0}],cur:null,BASEW:BASEW};
  function speedOf(){return Math.min(8.5,3.6+S.score*.1)}
  function newBlock(){var top=S.stack[S.stack.length-1],fromLeft=S.stack.length%2===0,span=top.w/2+REACH,c=top.x+top.w/2;
    S.cur={x:fromLeft?-span-top.w/2+c:span-top.w/2+c,c0:c,w:top.w,y:S.stack.length,dir:fromLeft?1:-1,h:(hue0+S.stack.length*9)%360,span:span}}
  newBlock();
  S.input=function(c){if(S.over||c!==1)return;var cur=S.cur,top=S.stack[S.stack.length-1],off=cur.x-top.x,ab=Math.abs(off);
    if(ab>=top.w){S.over=true;emit('miss',cur);return}
    if(ab<5){cur.x=top.x;S.combo++;if(S.combo>=3&&cur.w<BASEW){cur.w=Math.min(BASEW,cur.w+12);cur.x-=6}emit('perfect',S.combo)}
    else{S.combo=0;var keepX=Math.max(cur.x,top.x),keepW=cur.w-ab,cutX=off>0?top.x+top.w:cur.x;
      emit('cut',{x:cutX,w:ab,y:cur.y,h:cur.h,dir:off>0?1:-1});cur.x=keepX;cur.w=keepW}
    S.stack.push({x:cur.x,w:cur.w,y:cur.y,h:cur.h});S.score++;emit('placed',S.score);newBlock()};
  S.step=function(){
    if(S.over){S.dying++;S.frame++;return}
    var cur=S.cur,lim=cur.span,c0=cur.c0;cur.x+=cur.dir*speedOf();
    if(cur.x>c0+lim-cur.w/2){cur.x=c0+lim-cur.w/2;cur.dir=-1}if(cur.x<c0-lim-cur.w/2){cur.x=c0-lim-cur.w/2;cur.dir=1}
    S.frame++;
  };
  return S;
};

/* ===== Rendu Canvas Pile Poil ===== */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=400,H=700,sc=1,dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);sc=innerHeight/700;W=Math.min(innerWidth/sc,560);H=700;cv.width=W*sc*dpr|0;cv.height=H*sc*dpr|0;cv.style.width=W*sc+'px';cv.style.height=H*sc+'px'}
addEventListener('resize',resize);resize();
const BH=34;
let S=SIM(1,{}),falling=[],parts=[],cam=0,camT=0,t=0,sent=false;
function reset(seed){S=SIM(seed,{ev:onEv});CG.setSim(S);falling=[];parts=[];cam=0;camT=0;sent=false;CG.setScore(0)}
function onEv(n,v){
  if(n==='miss'){falling.push({...v,vy:0,vx:v.dir*2,rot:0,vr:v.dir*.03});CG.sfx.hit();CG.flash()}
  else if(n==='perfect'){const cur=S.cur;CG.sfx.tone(523*Math.pow(1.06,Math.min(v,12)),0,.15,{type:'triangle',v:.45});
    for(let i=0;i<14;i++)parts.push({x:cur.x+Math.random()*cur.w,y:cur.y,vx:(Math.random()-.5)*3,vy:Math.random()*3,l:30,c:'#fff'});
    if(v>1)CG.popup(v>=5?'PILE POIL ×'+v+' 🔥':'Pile poil ×'+v)}
  else if(n==='cut'){falling.push({x:v.x,w:v.w,y:v.y,h:v.h,vy:0,vx:v.dir*1.5,rot:0,vr:v.dir*.04});CG.sfx.tone(300,0,.08,{type:'square',v:.25});CG.sfx.noise(0,.08,.4,900)}
  else if(n==='placed'){CG.setScore(v,true);CG.target(v);if(v%25===0){CG.popup(v+' étages !');CG.sfx.big()}camT=Math.max(0,(S.stack.length-9)*BH)}
}
function drop(){if(CG.state!=='play'||S.over)return;CG.input(1)}
addEventListener('keydown',e=>{
  if(isTypingInInput(e))return;
  if((e.code==='Space'||e.code==='ArrowDown'||e.code==='Enter')&&CG.state==='play'){e.preventDefault();drop()}
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();drop()});
function step(){t++;
  if(CG.state==='play'){CG.tick();if(S.over&&S.dying===70&&!sent){sent=true;CG.sfx.lose();CG.over(S.score,'étages')}}
  for(const f of falling){f.vy+=.5;f.yy=(f.yy||0)+f.vy;f.x+=f.vx;f.rot+=f.vr}falling=falling.filter(f=>f.yy<1400);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy*.03;p.l--}parts=parts.filter(p=>p.l>0);
  cam+=(camT-cam)*.08;
}
const baseY=()=>H-110;
function sy(y){return baseY()-y*BH+cam}
function plate(x,y,w,h,alpha){const X=W/2+x,Y=sy(y)-BH;ctx.globalAlpha=alpha==null?1:alpha;
  const g=ctx.createLinearGradient(0,Y,0,Y+BH);g.addColorStop(0,`hsl(${h},90%,68%)`);g.addColorStop(1,`hsl(${h},85%,50%)`);ctx.fillStyle=g;ctx.strokeStyle='#12102b';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(X,Y+2,w,BH-4,8):ctx.rect(X,Y+2,w,BH-4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffffff40';ctx.fillRect(X+6,Y+7,Math.max(0,w-12),4);ctx.globalAlpha=1}
function draw(){
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  const stack=S.stack,cur=S.cur,dead=S.over,hue0=S.hue0;const top=stack.length,g=ctx.createLinearGradient(0,0,0,H);const hh=(hue0+top*4)%360;
  g.addColorStop(0,`hsl(${(hh+200)%360},70%,${Math.max(12,45-top*.4)}%)`);g.addColorStop(1,`hsl(${(hh+230)%360},75%,${Math.max(20,58-top*.3)}%)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(top>20){ctx.fillStyle='#ffffff';for(let i=0;i<40;i++){ctx.globalAlpha=Math.min(.8,(top-20)/40);ctx.fillRect((i*97)%W,(i*61+cam*.2)%H,2,2)}ctx.globalAlpha=1}
  ctx.fillStyle='#12102b';ctx.fillRect(W/2-150,sy(0),300,H);ctx.fillStyle='#ffd426';ctx.fillRect(W/2-150,sy(0),300,6);
  for(const b of stack)if(sy(b.y)>-BH&&sy(b.y)<H+BH)plate(b.x,b.y,b.w,b.h);
  for(const f of falling){ctx.save();const cx=W/2+f.x+f.w/2,cy=sy(f.y)-BH/2+f.yy;ctx.translate(cx,cy);ctx.rotate(f.rot);ctx.translate(-cx,-cy+f.yy);plate(f.x,f.y,f.w,f.h);ctx.restore()}
  if(CG.state==='play'&&!dead)plate(cur.x,cur.y,cur.w,cur.h);
  if(CG.state==='play'&&!dead){const tp=stack[stack.length-1];ctx.strokeStyle='#ffffff55';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.strokeRect(W/2+tp.x,sy(cur.y)-BH+2,tp.w,BH-4);ctx.setLineDash([])}
  for(const p of parts){ctx.globalAlpha=p.l/30;ctx.fillStyle=p.c;ctx.fillRect(W/2+p.x,sy(p.y)-BH-p.l*.6,3,3)}ctx.globalAlpha=1;
}
let last=performance.now(),acc=0;function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0});
CG.init({key:'pilepoil',sim:true,unit:'étages',medals:[[15,'🥉','Petite tour'],[30,'🥈','Gratte-ciel'],[50,'🥇','Tour Eiffel'],[80,'💎','Jusqu\'à la Lune']],lowMsg:'Ça penche…',onStart:reset});
requestAnimationFrame(frame);
</script>
