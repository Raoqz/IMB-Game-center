<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>6 qui prend ! - IMB Game Center</title>
<meta name="description" content="6 qui prend ! en ligne entre potes, avec des bots et beaucoup trop d'effets spéciaux.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

<!-- Tailwind & Style global IMB -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/style.css">

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Confettis & GameShell IMB -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="/shared/game-shell.js"></script>

<style>
:root{
  --blue:#1d4ed8;--blue2:#1a24c4;--yellow:#fed72d;--ink:#12131a;--white:#fff;
  --red:#ff3b5c;--green:#2ee59d;--purple:#9b5cff;--orange:#ff8a1f;--sky:#5ec8ff;
  --sh:4px 4px 0 var(--ink);
  --shell-offset:56px;
  --cw:min(74px, calc((100vw - 96px) / 6), calc((100dvh - var(--shell-offset) - 262px) / 8.7));
}
@media (min-width:760px){
  :root{--cw:min(84px, calc((100vw - 100px) / 10.6), calc((100dvh - var(--shell-offset) - 250px) / 7.6));}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background-color:var(--blue);
  background-image:radial-gradient(rgba(255,255,255,.08) 2px,transparent 2.6px),radial-gradient(circle at 50% 35%,#3c4bff 0,var(--blue) 55%,var(--blue2) 100%);
  background-size:24px 24px,100% 100%;
  color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:700;
  touch-action:manipulation;
}
.disp{font-family:'Lilita One',Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.4px}
button{font:inherit;color:inherit}

#app{
  margin-top:var(--shell-offset);
  height:calc(100dvh - var(--shell-offset));
  position:relative;
  overflow:hidden;
}
.screen{
  display:none !important;
  height:calc(100dvh - var(--shell-offset));
  width:100%;
}
.screen.on{display:flex !important}
#game.on{display:grid !important}
svg.bull{display:inline-block;vertical-align:middle}

/* Protection Z-Index et lisibilité des modales du Shell */
#shellTopBar{z-index:130 !important;}
#shellBtnRestoreBar{z-index:130 !important;}
#shellInviteStack{z-index:140 !important;}
#shellModalRules,#shellModalLeaderboard{
  z-index:150 !important;
  color:#12131a !important;
}
#shellModalRules .neo-box button,
#shellModalLeaderboard .neo-box button{
  color:#12131a !important;
  background:#f1f5f9;
  border:2px solid #12131a;
  border-radius:10px;
  min-width:34px;
  min-height:34px;
  padding:4px 10px;
  font-weight:900;
  cursor:pointer;
  box-shadow:2px 2px 0 #12131a;
}
#shellModalRules .neo-box button:hover,
#shellModalLeaderboard .neo-box button:hover{
  background:#fed72d;
}

/* ---------- Boutons ---------- */
.btn{
  font-family:'Lilita One',Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.4px;
  background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:14px;
  box-shadow:var(--sh);padding:10px 16px;font-size:19px;cursor:pointer;
  transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh)}
.btn.white{background:#fff;color:var(--ink)}.btn.blue{background:var(--blue);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:var(--ink)}
.btn.sm{font-size:15px;padding:6px 11px;border-radius:11px;box-shadow:3px 3px 0 var(--ink)}
.btn.big{font-size:23px;padding:13px 20px}
.btn.wide{width:100%}
.ibtn{width:38px;height:38px;padding:0;font-size:18px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}

/* ---------- Accueil ---------- */
#home{flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow-y:auto;position:relative}
#home > *{position:relative;z-index:1}
#home > .floaty{position:absolute;top:0}
.logo{width:96px;height:96px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:grid;place-items:center;color:var(--ink);animation:bob 2.4s ease-in-out infinite;flex:none}
.logo svg{width:62px;height:54px}
h1.title{margin:0;font-size:clamp(42px,11vw,78px);color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);transform:rotate(-3deg);line-height:1;text-align:center}
.tagline{margin:-4px 0 4px;opacity:.9;text-align:center;font-size:15px}
.panel{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:1px;opacity:.6}
.lbl{font-size:13px;opacity:.7;margin-bottom:-4px}
input.inp{font:inherit;font-size:18px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;width:100%;min-width:0;background:#f3f4ff;color:var(--ink);outline:none}
input.inp:focus{background:#fff;box-shadow:0 0 0 3px var(--yellow)}
#code{text-transform:uppercase;letter-spacing:3px;text-align:center}
.rowflex{display:flex;gap:8px;align-items:stretch}
.sep{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.5}
.sep::before,.sep::after{content:"";flex:1;border-top:2px dashed var(--ink)}
.note{font-size:13px;background:#fff6cc;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;line-height:1.35}
.floaty{position:absolute;font-size:34px;opacity:.18;animation:drift linear infinite;z-index:0 !important;pointer-events:none}
.homelinks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- Salon ---------- */
#lobby{align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
#lobby .panel{margin:auto 0;width:min(520px,100%)}
.codebox{text-align:center;background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px;box-shadow:var(--sh);cursor:pointer}
.codebox small{display:block;opacity:.8;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.codebox b{font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:44px;letter-spacing:8px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;background:#f3f4ff;border:3px solid var(--ink);border-radius:14px;padding:6px 8px;animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
.pitem.me{background:#fff3b0}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .tag{font-size:11px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px}
.x{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:9px;width:30px;height:30px;cursor:pointer;font-size:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);padding:6px 10px;cursor:pointer;font-size:14px;border-left:2px solid var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--yellow)}
.seg button:disabled{cursor:default}
.wait{text-align:center;padding:10px;font-size:15px;opacity:.75}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}

/* ---------- Jeu ---------- */
#game{grid-template-rows:auto auto auto minmax(0,1fr) auto;height:calc(100dvh - var(--shell-offset))}
.g-top{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
.g-top .info{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.pill.y{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.g-top .tools{display:flex;gap:6px}
.sm-only{display:none}
@media (max-width:520px){.lg-only{display:none}.sm-only{display:inline}.g-top .info{flex-wrap:nowrap}.g-top .ibtn{width:34px;height:34px;font-size:16px}.g-top{gap:6px;padding:6px 8px 4px}}
.scores{display:flex;gap:7px;padding:4px 10px 8px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.scores::-webkit-scrollbar{display:none}
@media (min-width:760px){.scores{flex-wrap:wrap;justify-content:center;overflow:visible}}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 4px 3px 3px;box-shadow:3px 3px 0 var(--ink);font-size:13px;position:relative;transition:transform .2s,opacity .3s}
.chip.me{background:var(--yellow)}
.chip.off{opacity:.55}
.chip.hit{animation:hit .6s}
.av{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-size:14px;overflow:hidden;flex:none;background:#888}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:44px;height:44px;font-size:20px;border-width:3px}
.chip .nm{max-width:10ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sc{display:flex;align-items:center;gap:3px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px 2px 6px;min-width:44px;justify-content:center}
.chip .sc svg{width:15px;height:13px;color:var(--yellow)}
.chip.warn .sc{background:var(--red)}
.chip.warn::after{content:'🔥';position:absolute;bottom:-8px;left:-6px;font-size:15px;animation:think .5s ease-in-out infinite}
.chip .st{position:absolute;top:-9px;right:-6px;font-size:14px;filter:drop-shadow(1px 1px 0 var(--ink))}
.chip .st.think{animation:think 1s ease-in-out infinite}
.chip .crown{position:absolute;top:-13px;left:4px;font-size:15px;transform:rotate(-18deg)}
.g-timer{height:7px;margin:0 12px 4px;border:2px solid var(--ink);border-radius:9px;background:rgba(18,16,43,.35);overflow:hidden;visibility:hidden}
.g-timer.on{visibility:visible}
.g-timer i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow) 40%,var(--green))}
.g-table{display:flex;align-items:center;justify-content:center;min-height:0;padding:2px 8px}
.rows{display:flex;flex-direction:column;gap:6px;align-items:center}
.row{display:flex;align-items:center;gap:4px;padding:4px;border-radius:15px;background:rgba(18,16,43,.28);border:3px solid transparent;position:relative;transition:background .2s,transform .2s,border-color .2s}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.14);border:2px dashed rgba(255,255,255,.22);flex:none}
.slot.s6{border-color:rgba(255,59,92,.55);background:rgba(255,59,92,.1);display:grid;place-items:center;font-size:calc(var(--cw)*.34);color:rgba(255,255,255,.35)}
.slot.s6::after{content:"💀";opacity:.5;filter:grayscale(.3)}
.badge{min-width:30px;height:30px;padding:0 5px;border-radius:999px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:2px;font-size:13px;flex:none;margin-left:2px}
.badge svg{width:13px;height:11px}
.row.full{border-color:var(--red);animation:danger 1s ease-in-out infinite}
.row.full .badge{background:var(--red);color:#fff}
.row.full .slot.s6{background:rgba(255,59,92,.28);border-style:solid}
.row.pickable{cursor:pointer;border-color:var(--yellow);animation:pickme .7s ease-in-out infinite alternate}
.row.pickable:hover{background:rgba(255,212,38,.35)}
.row.doomed{background:rgba(255,59,92,.6);border-color:#fff;transform:scale(1.04)}
.row.landed{animation:land .35s}

.g-bottom{background:rgba(18,16,43,.42);border-top:4px solid var(--ink);padding:6px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.b-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.b-head .msg{flex:1;min-width:0;font-size:14px;line-height:1.2}
.reacts{display:flex;gap:2px;flex:none}
.reacts button{border:0;background:transparent;font-size:20px;cursor:pointer;padding:2px;border-radius:8px;transition:transform .1s}
.reacts button:hover{transform:scale(1.25)}
.reacts button:active{transform:scale(.9)}
@media (max-width:420px){.reacts button:nth-child(n+5){display:none}}
.zone{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--cw)*2.8 + 30px)}
@media (min-width:760px){.zone{min-height:calc(var(--cw)*1.4 + 30px)}}
.hand{display:grid;grid-template-columns:repeat(5,var(--cw));gap:8px 6px;justify-content:center;padding-top:12px}
@media (min-width:760px){.hand{grid-template-columns:repeat(10,var(--cw))}}
.hc{border:0;background:none;padding:0;cursor:pointer;transition:transform .18s cubic-bezier(.2,1.5,.4,1);position:relative}
.hc:hover{transform:translateY(-6px)}
.hc.sel{transform:translateY(-14px) scale(1.06);z-index:2}
.hc.sel .card{box-shadow:0 0 0 4px var(--yellow),4px 4px 0 var(--ink)}
.hc.picked{transform:translateY(-14px)}
.hc.picked .card{box-shadow:0 0 0 4px var(--green),4px 4px 0 var(--ink)}
.hc.picked::after{content:"✔";position:absolute;top:-10px;right:-8px;background:var(--green);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.hand.dim .hc:not(.picked){opacity:.75}
.hand.deal .hc{animation:dealIn .55s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i) * 70ms)}
.spect{text-align:center;opacity:.85;padding:10px;align-self:center}

.reveal{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center;max-width:calc(var(--cw)*5 + 30px);padding-top:6px}
@media (min-width:760px){.reveal{max-width:none}}
.rv{width:var(--cw);perspective:600px;transition:opacity .4s,transform .3s}
.rv .fl{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.rv.flipped .fl{transform:rotateY(180deg)}
.rv .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rv .front{transform:rotateY(180deg)}
.rv .who{font-size:11px;text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv.active{transform:translateY(-8px) scale(1.08)}
.rv.active .who{color:var(--yellow)}
.rv.used .front .card{visibility:hidden}
.rv.used{opacity:.35}
.rv.low .front .card{box-shadow:0 0 0 4px var(--red),0 0 18px 4px rgba(255,59,92,.8),3px 3px 0 var(--ink)}

/* ---------- Cartes ---------- */
.card{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.4);border:3px solid var(--ink);border-radius:calc(var(--w)*.14);background:#fff;box-shadow:3px 3px 0 var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;flex:none;overflow:hidden;color:var(--ink)}
.card .hd{position:absolute;top:5%;left:3%;right:3%;display:flex;flex-wrap:wrap;justify-content:center;gap:0 1px;color:var(--hc)}
.card .hd svg{width:calc(var(--w)*.21);height:calc(var(--w)*.185)}
.card.h5 .hd svg,.card.h7 .hd svg{width:calc(var(--w)*.165);height:calc(var(--w)*.145)}
.card .n{font-family:'Lilita One',Impact,"Arial Black",sans-serif;font-size:calc(var(--w)*.5);color:var(--nc);margin-top:22%;line-height:1;text-shadow:calc(var(--w)*.03) calc(var(--w)*.03) 0 rgba(18,16,43,.18)}
.card::after{content:"";position:absolute;left:12%;right:12%;bottom:7%;height:calc(var(--w)*.05);border-radius:9px;background:var(--hc);opacity:.35}
.card.h1{--nc:var(--blue);--hc:#7d70ff}
.card.h2{background:#d6f1ff;--nc:#0a6fc2;--hc:#0a6fc2}
.card.h3{background:#fff0b0;--nc:#e06400;--hc:#e06400}
.card.h5{background:#ffd0d8;--nc:#d4143a;--hc:#d4143a}
.card.h7{background:linear-gradient(140deg,#6b1fff,#ff2f8e);--nc:#fff;--hc:var(--yellow);animation:glow 1.4s ease-in-out infinite}
.card.h7 .n{text-shadow:3px 3px 0 var(--ink)}
.cback{width:var(--cw);height:calc(var(--cw)*1.4);border:3px solid var(--ink);border-radius:calc(var(--cw)*.14);box-shadow:3px 3px 0 var(--ink);background:repeating-linear-gradient(45deg,var(--blue) 0 8px,#3241ff 8px 16px);display:grid;place-items:center;color:var(--yellow)}
.cback svg{width:55%;height:45%;filter:drop-shadow(2px 2px 0 var(--ink))}
.flying{pointer-events:none;will-change:transform}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,16,43,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:16px;backdrop-filter:blur(2px)}
.overlay.on{display:flex}
.modal{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);width:min(470px,100%);max-height:calc(100dvh - 88px);overflow:auto;padding:18px;animation:popIn .4s cubic-bezier(.2,1.5,.4,1)}
.modal h2{margin:0 0 10px;font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:30px;text-align:center;line-height:1.05}
.modal p,.modal li{line-height:1.45;font-size:14.5px}
.modal ul{padding-left:20px;margin:6px 0}
.res{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.res .r{display:grid;grid-template-columns:22px 30px 1fr auto auto;align-items:center;gap:8px;background:#f3f4ff;border:2px solid var(--ink);border-radius:12px;padding:5px 8px;font-size:14px}
.res .r.me{background:#fff3b0}
.res .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .bar{grid-column:3/6;height:6px;border-radius:9px;background:#dfe1ff;overflow:hidden;margin-top:-2px}
.res .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red))}
.plus{color:var(--red)}.zero{color:#0b9e63}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:14px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:30%}
.pod .nm{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border:3px solid var(--ink);border-radius:12px 12px 4px 4px;display:flex;align-items:flex-start;justify-content:center;font-family:'Lilita One',Impact,sans-serif;font-size:28px;padding-top:4px;box-shadow:3px 3px 0 var(--ink);animation:rise .7s cubic-bezier(.2,1.4,.4,1) backwards}
.pod.p1 .blk{height:96px;background:var(--yellow);animation-delay:.5s}
.pod.p2 .blk{height:70px;background:#dfe3ef;animation-delay:.25s}
.pod.p3 .blk{height:52px;background:#f2b58a}
.loser{margin-top:10px;background:#ffe1e6;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;text-align:center;font-size:14px}
.cd{text-align:center;font-size:13px;opacity:.7;margin-top:6px}
.headsref{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;--cw:46px}
.headsref div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}

#drawer{position:fixed;top:var(--shell-offset);right:0;bottom:0;width:min(330px,88vw);background:#fff;color:var(--ink);border-left:4px solid var(--ink);z-index:45;transform:translateX(105%);transition:transform .3s cubic-bezier(.3,1.2,.5,1);display:flex;flex-direction:column;box-shadow:-6px 0 0 rgba(18,16,43,.4)}
#drawer.on{transform:none}
#drawer header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:3px solid var(--ink)}
#drawer header b{font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:22px}

<script>
(function(){
  let pendingShellRoom = null;

  // Surcharger GameShell.joinRoom et sendDirectInvite AVANT GameShell.init()
  GameShell.joinRoom = async function(code) {
    if (!code) return false;
    const clean = String(code).trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!clean) return false;
    GameShell.currentRoomCode = clean;
    if (window.__sixquiprend && typeof window.__sixquiprend.joinFromShell === 'function') {
      window.__sixquiprend.joinFromShell(clean);
    } else {
      pendingShellRoom = clean;
    }
    return true;
  };

  GameShell.sendDirectInvite = async function(targetTag) {
    const activeCode = (window.__sixquiprend && window.__sixquiprend.getActiveCode && window.__sixquiprend.getActiveCode())
      || GameShell.currentRoomCode;

    if (!activeCode || activeCode === 'SOLO') {
      if (window.__sixquiprend && window.__sixquiprend.toast) {
        window.__sixquiprend.toast("⚠️ Crée d'abord une salle en ligne avant d'inviter un joueur !");
      } else {
        alert("Crée d'abord une salle en ligne avant d'inviter un camarade !");
      }
      return;
    }

    if (!GameShell.currentUser) return;
    GameShell.currentRoomCode = activeCode;

    const newInviteRef = db.ref(`invitations/${targetTag}`).push();
    await newInviteRef.set({
      id: newInviteRef.key,
      fromTag: GameShell.currentUser.tag,
      fromNick: GameShell.currentUser.nickname,
      gameId: '6quiprend',
      gameTitle: '6 qui prend !',
      roomCode: activeCode,
      timestamp: Date.now()
    });

    const dropdown = document.getElementById('shellUsersDropdown');
    if (dropdown) dropdown.classList.add('hidden');
    if (window.__sixquiprend && window.__sixquiprend.toast) {
      window.__sixquiprend.toast(`📨 Invitation envoyée à @${targetTag} (Salle ${activeCode}) !`);
    }
  };

  // Initialisation du GameShell commun
  GameShell.init({
    gameId: '6quiprend',
    gameTitle: '6 qui prend !',
    rulesHtml: `
      <p>• 🐮 <strong>But :</strong> Avoir le <strong>moins de têtes de bœuf</strong> possible ! La partie s'arrête dès qu'un joueur atteint 66 🐮 (par défaut).</p>
      <p>• 🃏 <strong>Déroulement :</strong> Chacun reçoit 10 cartes. À chaque tour, tout le monde choisit une carte en secret, puis on les pose de la plus petite à la plus grande sur les 4 rangées.</p>
      <p>• 📈 <strong>Règle de pose :</strong> Ta carte va toujours sur la rangée dont la dernière carte est <strong>la plus proche en dessous</strong> de la tienne.</p>
      <p>• 💀 <strong>La 6ᵉ carte :</strong> Si tu poses la 6ᵉ carte d'une rangée, tu ramasses les 5 premières cartes (et leurs pénalités 🐮) !</p>
      <p>• 😬 <strong>Carte trop petite :</strong> Si ta carte est plus petite que toutes les rangées, tu choisis toi-même quelle rangée tu ramasses.</p>
    `
  });

  // Fermer les modales du Shell en cliquant sur le fond sombre
  document.addEventListener('DOMContentLoaded', () => {
    const mLb = document.getElementById('shellModalLeaderboard');
    const mRl = document.getElementById('shellModalRules');
    if (mLb) mLb.addEventListener('click', (e) => { if (e.target === mLb) GameShell.closeLeaderboard(); });
    if (mRl) mRl.addEventListener('click', (e) => { if (e.target === mRl) GameShell.closeRules(); });
  });

  // Adapter la hauteur quand on masque/affiche la barre du Shell
  const origToggleBar = GameShell.toggleBarVisibility.bind(GameShell);
  GameShell.toggleBarVisibility = function() {
    origToggleBar();
    const bar = document.getElementById('shellTopBar');
    const hidden = bar && bar.style.transform === 'translateY(-100%)';
    document.documentElement.style.setProperty('--shell-offset', hidden ? '0px' : '56px');
    window.dispatchEvent(new Event('resize'));
  };

  function waitForIMBUser() {
    return new Promise((resolve) => {
      if (GameShell.currentUser) return resolve(GameShell.currentUser);
      const iv = setInterval(() => {
        if (GameShell.currentUser) {
          clearInterval(iv);
          resolve(GameShell.currentUser);
        }
      }, 60);
    });
  }

  // Pont compatible window.ChadGang propulsé par Firebase Realtime Database
  window.ChadGang = {
    hubUrl: window.location.origin,

    me: async function() {
      const u = await waitForIMBUser();
      return {
        id: u.tag,
        name: u.nickname,
        avatar: u.avatarEmoji || '🍺',
        isAdmin: u.role === 'admin'
      };
    },

    room: function() {
      if (pendingShellRoom) return pendingShellRoom;
      const q = new URLSearchParams(location.search).get('room');
      if (q) return q.toUpperCase();
      const m = location.hash.match(/room=([A-Z0-9]{4,12})/i);
      return m ? m[1].toUpperCase() : null;
    },

    join: function(code, opts) {
      const c = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      const L = { ready: [], players: [], message: [], error: [] };
      let closed = false;
      const roomRef = db.ref('rooms/6quiprend/' + c);
      let playersRef = null;
      let eventsRef = null;
      let lastStateRef = null;
      let myPlayerRef = null;

      function emit(n, a, b) {
        (L[n] || []).forEach(function(f) {
          try { f(a, b); } catch (e) { console.error(e); }
        });
      }

      const ch = {
        code: c,
        me: null,
        on: function(n, f) { (L[n] = L[n] || []).push(f); return ch; },
        send: async function(data, o) {
          if (closed) return;
          const u = await waitForIMBUser();
          const from = { id: u.tag, name: u.nickname };
          if (o && o.keep) {
            await roomRef.child('lastState').set({
              data: data,
              from: from,
              ts: firebase.database.ServerValue.TIMESTAMP
            });
          } else {
            const evRef = roomRef.child('events').push();
            await evRef.set({
              data: data,
              from: from,
              ts: firebase.database.ServerValue.TIMESTAMP
            });
            setTimeout(() => evRef.remove().catch(() => {}), 8000);
          }
        },
        leave: function() {
          closed = true;
          if (playersRef) playersRef.off();
          if (eventsRef) eventsRef.off();
          if (lastStateRef) lastStateRef.off();
          if (myPlayerRef) {
            myPlayerRef.child('online').set(false).catch(() => {});
          }
          if (GameShell.currentRoomCode === c) {
            GameShell.currentRoomCode = null;
          }
        }
      };

      waitForIMBUser().then(async (u) => {
        if (closed) return;
        ch.me = u.tag;

        const snap = await roomRef.once('value');
        const exists = snap.exists();

        if (!exists && opts && opts.create === false) {
          localStorage.removeItem('imb_active_room_6quiprend');
          emit('error', 'Salle introuvable : vérifie le code');
          return;
        }

        GameShell.currentRoomCode = c;
        localStorage.setItem('imb_active_room_6quiprend', c);
        window.location.hash = 'room=' + c;

        myPlayerRef = roomRef.child('players/' + u.tag);
        const existingPlayerSnap = await myPlayerRef.once('value');
        const existingPlayer = existingPlayerSnap.val();

        // Conserver joinedAt d'origine pour que l'hôte reste stable en cas de F5
        await myPlayerRef.set({
          id: u.tag,
          name: u.nickname,
          av: u.avatarEmoji || '🍺',
          online: true,
          joinedAt: (existingPlayer && existingPlayer.joinedAt) ? existingPlayer.joinedAt : Date.now()
        });
        myPlayerRef.child('online').onDisconnect().set(false);

        const roomSnap = await roomRef.once('value');
        const roomData = roomSnap.val() || {};
        const pMap = roomData.players || {};
        const activePlayers = Object.values(pMap)
          .filter(p => p && p.online !== false)
          .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
        const lastData = roomData.lastState ? roomData.lastState.data : null;

        emit('ready', {
          me: u.tag,
          players: activePlayers,
          last: lastData
        });

        playersRef = roomRef.child('players');
        playersRef.on('value', (pSnap) => {
          if (closed) return;
          const map = pSnap.val() || {};
          const list = Object.values(map)
            .filter(p => p && p.online !== false)
            .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
          emit('players', list);
        });

        let firstState = true;
        lastStateRef = roomRef.child('lastState');
        lastStateRef.on('value', (sSnap) => {
          if (closed) return;
          if (firstState) { firstState = false; return; }
          const val = sSnap.val();
          if (val && val.data) {
            emit('message', val.data, val.from || {});
          }
        });

        const nowTs = Date.now();
        eventsRef = roomRef.child('events').orderByChild('ts').startAt(nowTs);
        eventsRef.on('child_added', (eSnap) => {
          if (closed) return;
          const val = eSnap.val();
          if (val && val.data) {
            emit('message', val.data, val.from || {});
          }
        });
      }).catch((err) => {
        console.error(err);
        emit('error', 'Impossible de joindre la salle');
      });

      return ch;
    },

    createInvite: async function(opts) {
      opts = opts || {};
      if (opts.room) GameShell.currentRoomCode = opts.room;
      GameShell.announceGameInChat();
      return { code: opts.room };
    },

    finPartie: async function(o) {
      o = o || {};
      const u = await waitForIMBUser();
      const won = !!(o.gagne !== undefined ? o.gagne : o.won);
      if (won) {
        GameShell.fireConfetti();
      }
      const ref = db.ref('scores/6quiprend/' + u.tag);
      await ref.transaction((current) => {
        if (!current) {
          return {
            tag: u.tag,
            nickname: u.nickname,
            avatarEmoji: u.avatarEmoji || '🍺',
            wins: won ? 1 : 0,
            losses: won ? 0 : 1,
            draws: 0,
            updatedAt: Date.now()
          };
        }
        if (won) current.wins = (current.wins || 0) + 1;
        else current.losses = (current.losses || 0) + 1;
        current.nickname = u.nickname;
        current.avatarEmoji = u.avatarEmoji || current.avatarEmoji || '🍺';
        current.updatedAt = Date.now();
        return current;
      });
      return { counted: true };
    }
  };
})();
</script>

<script>
(() => {
'use strict';

/* =========================================================
   Outils & Normalisation Firebase
   ========================================================= */
const $ = s => document.querySelector(s);
const HUB = !!window.ChadGang;
const QS = new URLSearchParams(location.search);
const SPEED = Math.max(1, Math.min(20, +QS.get('speed') || 1));
const ms = x => x / SPEED;
const sleep = t => new Promise(r => setTimeout(r, t));
const wait = t => sleep(ms(t));
const now = () => performance.now();
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function toArr(x) {
  if (!x) return [];
  if (Array.isArray(x)) return x;
  if (typeof x === 'object') {
    const keys = Object.keys(x).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
    return keys.map(k => x[k]);
  }
  return [];
}

/* Reconstruit systématiquement les tableaux supprimés par Firebase lors d'une reprise ou d'un F5 */
function sanitizeStateForFirebase(st) {
  if (!st || typeof st !== 'object') return st;
  st.players = toArr(st.players).map(p => {
    if (!p) return p;
    p.hand = toArr(p.hand).map(Number);
    p.score = Number(p.score || 0);
    p.roundPts = Number(p.roundPts || 0);
    p.bot = !!p.bot;
    p.pick = (p.pick !== undefined && p.pick !== null) ? Number(p.pick) : null;
    return p;
  });
  st.rows = toArr(st.rows).map(r => toArr(r).map(Number));
  if (st.phase !== 'lobby' && st.rows.length < 4) {
    while (st.rows.length < 4) st.rows.push([]);
  }
  st.log = toArr(st.log);
  st.reveal = st.reveal ? toArr(st.reveal) : null;
  st.summary = st.summary ? toArr(st.summary) : null;
  if (st.anim && typeof st.anim === 'object') {
    st.anim.startRows = toArr(st.anim.startRows).map(r => toArr(r).map(Number));
    st.anim.reveal = toArr(st.anim.reveal);
    st.anim.steps = toArr(st.anim.steps).map(step => {
      if (step && step.taken) step.taken = toArr(step.taken).map(Number);
      return step;
    });

}

      const rv = rvOf(st.id); rv && rv.classList.add('active');
      const card = rv && rv.querySelector('.front .card');
      const rowEl = () => document.querySelector(`#g-rows .row[data-r="${st.row}"]`);
      const chip = document.querySelector(`.chip[data-id="${CSS.escape(st.id)}"]`);
      if (chip) { const sc = $('#g-scores'); if (sc.scrollWidth > sc.clientWidth) sc.scrollLeft = chip.offsetLeft - sc.clientWidth / 2 + chip.offsetWidth / 2; }
      if (st.taken) {
        await takeAnim(st, s, card);
      } else {
        const target = rowEl().children[V.rows[st.row].length];
        const f = fly(card, target, { dur: 450, trail: '#ffffff' }); if (card) card.style.visibility = 'hidden';
        await f;
        V.rows[st.row].push(st.card); renderRows(s, V); Sound.place();
        const r = rowEl(); r.classList.add('landed');
        const tc = center(r.children[V.rows[st.row].length - 1]); FX.burst(tc.x, tc.y, 8, .45);
        if (V.rows[st.row].length === 5) { Sound.danger(); FX.puff(tc.x, tc.y, '🔥', 4); floatText(r.children[4], '😅 de justesse', '#ffd426'); }
        await sleep(Math.max(0, ms(T.step) - (now() - t0)));
      }
      rv && rv.classList.remove('active'); rv && rv.classList.add('used');
    }
    const l0 = leaderOf(a.startScores), l1 = leaderOf(V.scores);
    if (l1 && l1 !== l0 && a.steps.some(x => x.taken)) {
      const p = pl(s, l1), ch = document.querySelector(`.chip[data-id="${CSS.escape(l1)}"]`);
      banner('NOUVEAU LEADER 👑', l1 === Net.me ? 'C\'est toi le boss 😎' : esc(p ? p.name : '?'), 'good'); Sound.crown();
      if (ch) { const c = center(ch); FX.burst(c.x, c.y, 30, .9, ['#ffd426', '#fff']); }
    }
    await wait(T.tail);
  } finally {
    animating = false; V = null;
  }
}

/* =========================================================
   Règles
   ========================================================= */
function rulesHTML() {
  const ex = [[7, '1'], [15, '2'], [30, '3'], [44, '5'], [55, '7']];
  return `<h2>📖 Les règles</h2>
  <ul>
    <li>Chaque manche, tout le monde reçoit <b>10 cartes</b>. Il y a <b>4 rangées</b> sur la table.</li>
    <li>À chaque tour, chacun choisit <b>une carte en secret</b>. Puis on révèle tout en même temps.</li>
    <li>Les cartes se posent de la <b>plus petite à la plus grande</b>, au bout de la rangée qui finit par le nombre <b>le plus proche en dessous</b>.</li>
    <li>💀 Si ta carte est la <b>6ᵉ</b> d'une rangée, tu ramasses les 5 cartes. Ta carte démarre la nouvelle rangée.</li>
    <li>😬 Si ta carte est <b>plus petite que toutes les rangées</b>, tu choisis une rangée à ramasser.</li>
    <li>🐮 Chaque carte ramassée vaut des têtes de bœuf (des points de pénalité) :</li>
  </ul>
  <div class="headsref">${ex.map(([c, l]) => `<div>${cardHTML(c)}<span>${l} 🐮</span></div>`).join('')}</div>
  <p style="text-align:center;font-size:13px;margin:0">dizaines → 3 · multiples de 5 → 2 · doubles (11, 22…) → 5 · le 55 → 7</p>
  <ul><li>🏁 La partie s'arrête quand quelqu'un atteint le <b>score cible</b> (66 par défaut). <b>Le moins de têtes gagne.</b></li></ul>
  <div class="mbtns"><button class="btn" data-act="closeModal">Compris ! 🐂</button></div>`;
}

/* =========================================================
   Interactions
   ========================================================= */
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  const s = G;
  switch (a) {
    case 'create': Sound.click(); joinRoom(genCode(), true); break;
    case 'join': Sound.click(); doJoin(); break;
    case 'resumeOnline': {
      Sound.click();
      const saved = localStorage.getItem('imb_active_room_6quiprend');
      if (saved) joinRoom(saved, false);
      break;
    }
    case 'copyCode': {
      if (Net.code && Net.code !== 'SOLO') {
        try { navigator.clipboard.writeText(Net.code); toast('Code ' + Net.code + ' copié !'); }
        catch (err) { toast('Code : ' + Net.code); }
      }
      break;
    }
    case 'announceChat': {
      if (Net.code && Net.code !== 'SOLO' && window.ChadGang) {
        ChadGang.createInvite({ room: Net.code });
      }
      break;
    }
    case 'solo': Sound.click(); startSolo(false); break;
    case 'resume': Sound.click(); startSolo(true); break;
    case 'rules': Sound.click(); openModal(rulesHTML(), 'rules'); break;
    case 'closeModal': Sound.click(); closeOverlay(); if (G) renderOverlay(G); break;
    case 'mute': {
      const m = Sound.toggle(); toast(m ? '🔇 Son coupé' : '🔊 Son activé'); if (!m) Sound.ding();
      if ($('#home').classList.contains('on')) renderHome(); else if (G && G.phase !== 'lobby' && !animating) renderTop(G);
      break;
    }
    case 'log': $('#drawer').classList.toggle('on'); break;
    case 'quit':
      if (S && S.phase !== 'lobby' && S.phase !== 'over' && Net.mode === 'hub' && !confirmQuit()) break;
      Sound.click(); goHome(); break;
    case 'addBot': if (isHost() && S && S.phase === 'lobby') { addBot(S); Sound.pop(); commit(); } break;
    case 'rmBot': if (isHost() && S && S.phase === 'lobby') { S.players = S.players.filter(p => p.id !== t.dataset.id); Sound.click(); commit(); } break;
    case 'set': if (isHost() && S && S.phase === 'lobby') {
      const k = t.dataset.k, v = t.dataset.v; S.settings[k] = k === 'bot' ? v : +v; Sound.click(); commit();
    } break;
    case 'start': if (isHost() && S && S.phase === 'lobby') { Sound.click(); startGame(); } break;
    case 'card': {
      if (!s || s.phase !== 'pick' || animating) break;
      const c = +t.dataset.c, me = pl(s, Net.me); if (!me || !me.hand.includes(c)) break;
      if (sel === c) playCard(c); else { sel = c; Sound.select(); renderBottom(s); }
      break;
    }
    case 'play': if (sel != null) playCard(sel); break;
    case 'row': {
      if (!s || s.phase !== 'choose' || s.chooser !== Net.me) break;
      const idx = +t.dataset.r; Sound.click();
      myRow = { k: turnKey(s), idx };
      document.querySelectorAll('#g-rows .row').forEach(r => r.classList.toggle('chosen', +r.dataset.r === idx));
      const rc = center(t); FX.burst(rc.x, rc.y, 16, .7, ['#ffd426', '#fff']);
      act({ t: 'row', idx, k: turnKey(s) });
      break;
    }
    case 'react': sendReact(t.dataset.e); break;
    case 'next': if (isHost() && S && S.phase === 'roundEnd') { Sound.click(); newRound(); } break;
    case 'rematch': if (isHost() && S && S.phase === 'over') { Sound.click(); refreshRoster(); startGame(); } break;
    case 'toLobby': if (isHost() && S && S.phase === 'over') {
      Sound.click(); refreshRoster(); S.phase = 'lobby'; S.anim = null; S.summary = null; S.rows = []; S.log = [];
      S.players.forEach(p => { p.score = 0; p.roundPts = 0; p.hand = []; p.pick = null; }); syncLobby(); setDeadline(null); commit();
    } break;
  }
});
function confirmQuit() { try { return window.confirm('Quitter la partie en cours ? (tu pourras revenir avec le même code)'); } catch (e) { return true; } }
function playCard(c) {
  const s = G; if (!s || s.phase !== 'pick') return;
  const k = turnKey(s);
  myPick = { k, card: c, at: now() }; sel = null;
  Sound.play();
  const el = document.querySelector(`.hc[data-c="${c}"]`);
  if (el) { const cc = center(el); FX.burst(cc.x, cc.y, 14, .6, ['#2ee59d', '#ffd426', '#ffffff']); }
  act({ t: 'pick', card: c, k });
  renderBottom(s); renderScores(s);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#drawer').classList.contains('on')) $('#drawer').classList.remove('on');
    else if ($('#overlay').dataset.kind === 'rules') { closeOverlay(); G && renderOverlay(G); }
    if (window.GameShell) {
      GameShell.closeLeaderboard();
      GameShell.closeRules();
    }
  }
});
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay' && $('#overlay').dataset.kind === 'rules') { closeOverlay(); G && renderOverlay(G); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && G && !animating) render(); });

/* =========================================================
   Démarrage
   ========================================================= */
(async function boot() {
  if (HUB) { try { ME = await ChadGang.me(); } catch (e) { ME = null; } }
  myAvatar = ME && ME.avatar || null;
  myName = ((ME && ME.name) || LS.get('sqp-name', '') || 'Joueur').slice(0, 24);
  show('home'); renderHome();
  let inv = null;
  try { inv = HUB && typeof ChadGang.room === 'function' ? ChadGang.room() : null; } catch (e) {}
  if (inv) { inv = String(inv).toUpperCase().replace(/[^A-Z0-9]/g, ''); if (inv.length >= 4) joinRoom(inv, false); }
})();

window.__sixquiprend = {
  toast,
  getActiveCode: () => (Net.mode === 'hub' && Net.code) ? Net.code : null,
  joinFromShell: (code) => joinRoom(code, false)
};
})();
</script>
