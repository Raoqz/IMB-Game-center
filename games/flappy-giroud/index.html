<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Giroud - IMB Game Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Confetti & Shell commun -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="/shared/game-shell.js"></script>
</head>
<body class="bg-[#1d4ed8] text-[#12131a] flex flex-col min-h-screen pt-14 select-none items-center justify-center p-2 sm:p-4">

  <!-- ================= ÉCRAN D'ACCUEIL DU JEU ================= -->
  <main id="viewLobby" class="flex-1 flex items-center justify-center w-full max-w-lg py-6">
    <div class="neo-box bg-white w-full p-6 sm:p-8 text-center border-[3px] border-[#12131a] shadow-[4px_6px_0px_#12131a] rounded-2xl">
      
      <div class="w-36 h-36 mx-auto flex items-center justify-center mb-4">
        <img id="lobbyGiroudImg" src="/games/flappy-giroud/giroud.png" alt="Giroud" class="w-full h-full object-contain drop-shadow-[4px_6px_0px_#12131a]" onerror="this.style.display='none'; this.parentElement.innerHTML='⚽';">
      </div>

      <h2 class="text-4xl font-black italic tracking-tight text-[#12131a] uppercase leading-none mb-2">
        FLAPPY GIROUD
      </h2>
      <p class="text-xs sm:text-sm font-bold text-slate-500 mb-6">
        Format panoramique grand écran : esquive les tuyaux rapprochés en coup de tête !
      </p>

      <div class="p-3.5 bg-[#f8fafc] border-[2.5px] border-[#12131a] rounded-xl flex items-center justify-between mb-6 shadow-[2px_3px_0px_#12131a]">
        <div class="flex items-center gap-2">
          <span class="text-2xl">🏆</span>
          <span class="text-xs font-black text-slate-600 uppercase">Mon record :</span>
        </div>
        <span id="lobbyPersonalRecord" class="font-mono text-base font-black text-indigo-600 bg-indigo-50 border border-indigo-200 px-3 py-0.5 rounded-lg">
          0 pts
        </span>
      </div>

      <button onclick="startGame()" class="w-full neo-btn bg-[#fed72d] hover:bg-[#eec418] text-[#12131a] py-4 rounded-2xl text-sm sm:text-base font-black flex items-center justify-center gap-2 mb-3 shadow-[3px_4px_0px_#12131a]">
        <span>⚽</span>
        <span>Coup d'envoi (Jouer)</span>
      </button>

      <button onclick="GameShell.openRules()" class="w-full text-xs font-bold text-slate-500 hover:text-black underline flex items-center justify-center gap-1">
        <span>📖</span>
        <span>Les règles du jeu</span>
      </button>
    </div>
  </main>

  <!-- ================= PLATEAU DE JEU ================= -->
  <div id="viewGame" class="hidden flex-1 flex flex-col items-center justify-center w-full max-w-6xl py-1">
    
    <!-- Barre de commandes du haut -->
    <div class="w-full flex items-center justify-between mb-2.5 px-2">
      <button onclick="exitToLobby()" class="neo-btn bg-white hover:bg-slate-100 text-[#12131a] px-4 py-2 rounded-xl text-xs sm:text-sm font-black shadow-[2px_2px_0px_#12131a]">
        ← Menu
      </button>

      <div class="flex items-center gap-3">
        <span class="text-xs sm:text-sm font-mono font-black bg-white border-2 border-[#12131a] px-3.5 py-1.5 rounded-xl shadow-[2px_2px_0px_#12131a]">
          Record : <strong id="inGameRecord" class="text-indigo-600">0</strong>
        </span>
      </div>
    </div>

    <!-- Conteneur Canvas XXL avec Score en direct flottant au-dessus -->
    <div id="canvasWrapper" class="relative w-full">
      
      <!-- GROS SCORE FLOTTANT AU-DESSUS DE L'ÉCRAN -->
      <div id="liveScoreHud" class="absolute top-4 left-1/2 -translate-x-1/2 z-10 pointer-events-none flex items-center gap-2 bg-[#fed72d] border-[3px] border-[#12131a] shadow-[4px_5px_0px_#12131a] px-6 py-2 rounded-2xl">
        <span class="text-2xl">⚽</span>
        <span id="inGameScore" class="font-mono text-3xl sm:text-4xl font-black text-[#12131a] leading-none">0</span>
      </div>

      <canvas id="flappyCanvas" width="1200" height="640" class="w-full h-auto border-[3px] border-[#12131a] rounded-2xl shadow-[5px_7px_0px_#12131a] bg-[#70c5ce] block"></canvas>

      <!-- Overlay Prêt à jouer -->
      <div id="startOverlay" class="absolute inset-0 bg-black/25 rounded-2xl flex flex-col items-center justify-center text-center p-4 pointer-events-none z-10">
        <div class="bg-white border-[3px] border-[#12131a] px-6 py-4 rounded-2xl shadow-[4px_5px_0px_#12131a] animate-pulse">
          <p class="font-black text-base sm:text-lg text-[#12131a]">ESPACE ou CLIC</p>
          <p class="text-xs font-bold text-slate-500 mt-0.5">pour donner un coup de tête !</p>
        </div>
      </div>

      <!-- Overlay Fin de match -->
      <div id="gameOverOverlay" class="hidden absolute inset-0 bg-[#121422]/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-4 text-center z-20">
        <div class="neo-box bg-white max-w-md w-full p-6 sm:p-8 text-center border-[3px] border-[#12131a] shadow-[5px_7px_0px_#12131a] rounded-2xl">
          <div class="text-4xl mb-1">🛑</div>
          <h3 class="text-2xl font-black italic tracking-tight text-rose-600 uppercase mb-4 leading-none">
            Fin de match !
          </h3>

          <div class="bg-slate-50 border-[2.5px] border-[#12131a] rounded-xl p-4 mb-4 space-y-2">
            <div class="flex justify-between items-center text-sm font-black">
              <span class="text-slate-500 uppercase">Score :</span>
              <span id="finalScore" class="text-xl text-[#12131a] font-mono font-black">0</span>
            </div>
            <div class="flex justify-between items-center text-sm font-black pt-2 border-t border-slate-200">
              <span class="text-slate-500 uppercase">Meilleur record :</span>
              <span id="finalBest" class="text-indigo-600 font-mono font-black text-lg">0 pts</span>
            </div>
          </div>

          <div id="newRecordBanner" class="hidden mb-4 py-2 bg-amber-100 border-2 border-amber-400 rounded-xl text-amber-900 text-xs font-black uppercase animate-bounce">
            🎉 Nouveau record personnel !
          </div>

          <button onclick="restartGame()" class="w-full neo-btn bg-[#fed72d] hover:bg-[#eec418] text-[#12131a] py-3.5 rounded-xl text-sm font-black shadow-[3px_4px_0px_#12131a]">
            Rejouer (Espace) ⚽
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- ================= MOTEUR DE JEU ================= -->
  <script>
    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');

    // Images
    const giroudImg = new Image();
    giroudImg.src = '/games/flappy-giroud/giroud.png';
    let imgLoaded = false;
    giroudImg.onload = () => { imgLoaded = true; };

    const fondImg = new Image();
    fondImg.src = '/games/flappy-giroud/fond.jpg';
    let fondLoaded = false;
    fondImg.onload = () => {
      fondLoaded = true;
      if (fondImg.naturalWidth && fondImg.naturalHeight) {
        const ratio = fondImg.naturalHeight / fondImg.naturalWidth;
        canvas.height = Math.round(canvas.width * ratio);
      }
    };

    // État
    let gameState = 'LOBBY';
    let personalBest = 0;
    let score = 0;
    let animationFrameId = null;

    // Physique
    const GRAVITY = 0.088;
    const JUMP_FORCE = -3.2;
    const PIPE_WIDTH = 84;
    const GROUND_HEIGHT = 42;

    // Tête de Giroud
    let player = {
      x: 180,
      y: 260,
      visualSize: 130,
      hitboxRadius: 32,
      velocity: 0,
      rotation: 0
    };

    let pipes = [];
    let frameCount = 0;

    GameShell.init({
      gameId: 'flappy-giroud',
      gameTitle: 'Flappy Giroud',
      rulesHtml: `
        <p>• <strong>Commandes :</strong> Appuie sur <kbd class="bg-slate-100 px-1 border rounded">Espace</kbd>, clique ou touche l'écran pour planer vers le haut.</p>
        <p>• <strong>Obstacles rapprochés :</strong> Les poteaux s'enchaînent à un rythme soutenu, reste concentré !</p>
        <p>• <strong>Mode rouge (30+ pts) :</strong> Des tuyaux rouges mobiles oscillent de haut en bas.</p>
        <p>• <strong>Classement :</strong> Ton meilleur score est automatiquement enregistré dans le classement général de la promo !</p>
      `
    });

    auth.onAuthStateChanged(async (user) => {
      if (!user) return;
      const snap = await db.ref(`users/${user.uid}`).once('value');
      const uData = snap.val();
      if (!uData) return;

      const scoreSnap = await db.ref(`scores/flappy-giroud/${uData.tag}`).once('value');
      const sData = scoreSnap.val();
      if (sData && (sData.wins !== undefined || sData.score !== undefined)) {
        personalBest = sData.wins || sData.score || 0;
      }
      updateRecordDisplays();
    });

    function updateRecordDisplays() {
      document.getElementById('lobbyPersonalRecord').textContent = `${personalBest} pts`;
      document.getElementById('inGameRecord').textContent = personalBest;
    }

    function startGame() {
      document.getElementById('viewLobby').classList.add('hidden');
      document.getElementById('viewGame').classList.remove('hidden');
      resetGame();
      gameState = 'READY';
      document.getElementById('startOverlay').classList.remove('hidden');
      document.getElementById('gameOverOverlay').classList.add('hidden');
      renderLoop();
    }

    function exitToLobby() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameState = 'LOBBY';
      document.getElementById('viewGame').classList.add('hidden');
      document.getElementById('viewLobby').classList.remove('hidden');
      updateRecordDisplays();
    }

    function resetGame() {
      player.y = Math.round(canvas.height / 2);
      player.velocity = 0;
      player.rotation = 0;
      pipes = [];
      score = 0;
      frameCount = 0;
      document.getElementById('inGameScore').textContent = '0';
      document.getElementById('newRecordBanner').classList.add('hidden');
    }

    function flap() {
      if (gameState === 'READY') {
        gameState = 'PLAYING';
        document.getElementById('startOverlay').classList.add('hidden');
        player.velocity = JUMP_FORCE;
      } else if (gameState === 'PLAYING') {
        player.velocity = JUMP_FORCE;
      } else if (gameState === 'GAMEOVER') {
        restartGame();
      }
    }

    function restartGame() {
      resetGame();
      gameState = 'PLAYING';
      document.getElementById('gameOverOverlay').classList.add('hidden');
      document.getElementById('startOverlay').classList.add('hidden');
    }

    // Difficulté : tuyaux plus rapprochés verticalement et vitesse progressive
    function getDifficultyParams(currentScore) {
      let gap = 205;
      let speed = 2.1;
      let redProb = 0;

      if (currentScore >= 50) {
        gap = 175;
        speed = 2.7;
        redProb = 0.65;
      } else if (currentScore >= 30) {
        gap = 185;
        speed = 2.45;
        redProb = 0.25 + (currentScore - 30) * 0.015;
      } else if (currentScore >= 16) {
        gap = 195;
        speed = 2.25;
        redProb = 0;
      }

      return { gap, speed, redProb };
    }

    function spawnPipe() {
      const { gap, redProb } = getDifficultyParams(score);
      const isRed = score >= 30 && (Math.random() < redProb);
      const minTop = 50;
      const maxTop = canvas.height - GROUND_HEIGHT - gap - 50;
      const topHeight = Math.floor(minTop + Math.random() * (maxTop - minTop));

      pipes.push({
        x: canvas.width + 10,
        topHeight: topHeight,
        gap: gap,
        passed: false,
        isRed: isRed,
        oscillationAngle: Math.random() * Math.PI * 2,
        oscillationSpeed: 0.026
      });
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      frameCount++;
      const { speed } = getDifficultyParams(score);

      // Descente lente
      player.velocity += GRAVITY;
      player.y += player.velocity;
      player.rotation = Math.min(Math.PI / 7, Math.max(-Math.PI / 8, player.velocity * 0.06));

      // Poteaux beaucoup plus rapprochés horizontalement
      const spawnInterval = Math.max(95, Math.floor(130 - score * 0.4));
      if (frameCount % spawnInterval === 0) {
        spawnPipe();
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= speed;

        if (p.isRed) {
          p.oscillationAngle += p.oscillationSpeed;
          p.topHeight += Math.sin(p.oscillationAngle) * 1.3;
          p.topHeight = Math.max(40, Math.min(canvas.height - GROUND_HEIGHT - p.gap - 40, p.topHeight));
        }

        if (!p.passed && p.x + PIPE_WIDTH < player.x) {
          p.passed = true;
          score++;
          document.getElementById('inGameScore').textContent = score;
        }

        if (p.x + PIPE_WIDTH < -40) {
          pipes.splice(i, 1);
          continue;
        }

        const bottomPipeY = p.topHeight + p.gap;
        const playerBox = {
          left: player.x - player.hitboxRadius,
          right: player.x + player.hitboxRadius,
          top: player.y - player.hitboxRadius,
          bottom: player.y + player.hitboxRadius
        };

        const inPipeX = playerBox.right > p.x && playerBox.left < p.x + PIPE_WIDTH;
        const hitsTop = inPipeX && playerBox.top < p.topHeight;
        const hitsBottom = inPipeX && playerBox.bottom > bottomPipeY;

        if (hitsTop || hitsBottom) {
          triggerGameOver();
          return;
        }
      }

      if (player.y + player.hitboxRadius >= canvas.height - GROUND_HEIGHT || player.y - player.hitboxRadius <= 0) {
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalBest').textContent = `${Math.max(score, personalBest)} pts`;

      if (score > personalBest) {
        personalBest = score;
        document.getElementById('newRecordBanner').classList.remove('hidden');
        updateRecordDisplays();
        saveScoreToFirebase(score);
        GameShell.fireConfetti();
      }

      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    async function saveScoreToFirebase(newRecord) {
      if (!GameShell.currentUser) return;
      const tag = GameShell.currentUser.tag;
      await db.ref(`scores/flappy-giroud/${tag}`).set({
        tag: tag,
        nickname: GameShell.currentUser.nickname,
        avatarEmoji: '⚽',
        wins: newRecord,
        updatedAt: Date.now()
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fond fixe (sans aucun défilement)
      if (fondLoaded) {
        ctx.drawImage(fondImg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#101528';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Tuyaux
      pipes.forEach(p => {
        const pipeColor = p.isRed ? '#ef4444' : '#15803d';
        const capColor = p.isRed ? '#b91c1c' : '#166534';

        // Tuyau haut
        ctx.fillStyle = pipeColor;
        ctx.strokeStyle = '#12131a';
        ctx.lineWidth = 3.5;
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
        ctx.strokeRect(p.x, -2, PIPE_WIDTH, p.topHeight + 2);

        ctx.fillStyle = capColor;
        ctx.fillRect(p.x - 4, p.topHeight - 26, PIPE_WIDTH + 8, 26);
        ctx.strokeRect(p.x - 4, p.topHeight - 26, PIPE_WIDTH + 8, 26);

        // Tuyau bas
        const bottomY = p.topHeight + p.gap;
        const bottomHeight = canvas.height - GROUND_HEIGHT - bottomY;
        ctx.fillStyle = pipeColor;
        ctx.fillRect(p.x, bottomY, PIPE_WIDTH, bottomHeight);
        ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, bottomHeight + 5);

        ctx.fillStyle = capColor;
        ctx.fillRect(p.x - 4, bottomY, PIPE_WIDTH + 8, 26);
        ctx.strokeRect(p.x - 4, bottomY, PIPE_WIDTH + 8, 26);
      });

      // Sol
      ctx.fillStyle = '#27272a';
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
      ctx.strokeStyle = '#12131a';
      ctx.lineWidth = 3.5;
      ctx.strokeRect(-2, canvas.height - GROUND_HEIGHT, canvas.width + 4, GROUND_HEIGHT + 4);

      ctx.fillStyle = '#3f3f46';
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 8);
      ctx.strokeRect(-2, canvas.height - GROUND_HEIGHT, canvas.width + 4, 8);

      // Tête de Giroud
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.rotation);

      if (imgLoaded) {
        const size = player.visualSize;
        ctx.drawImage(giroudImg, -size / 2, -size / 2, size, size);
      } else {
        ctx.font = '54px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚽', 0, 0);
      }

      ctx.restore();
    }

    function renderLoop() {
      if (gameState === 'LOBBY') return;
      update();
      draw();
      animationFrameId = requestAnimationFrame(renderLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });
  </script>
</body>
</html>
